# Glance dashboard - 110 network fleet view
#
# This file is the AUTHORITATIVE copy of the dashboard configuration.
# It is seeded byte-for-byte into the `glance-swarm_config` volume on
# ore-dock-110-1 and mounted at /app/config/glance.yml in the container.
#
# There is deliberately NO secret material in this file. Glance expands
# dollar-brace variables from the process environment at parse time, so
# the auth secret key and the bcrypt password hash arrive via the
# Portainer stack env. That keeps this repo safe to clone anonymously.
#
# NOTE: the parser does NOT skip comments, so never write a literal
# dollar-brace variable in a comment here - it will be expanded and the
# config will fail to load with "environment variable ... not found".

server:
  # Must match the published port in docker-compose.yml.
  port: 8084
  # Nginx Proxy Manager is in front of this service and sets
  # X-Forwarded-For. Glance uses the last entry in that header for auth
  # rate limiting, which is the real client address.
  proxied: true

auth:
  # base64 of exactly 64 random bytes. Signs the session cookie.
  secret-key: "${GLANCE_SECRET_KEY}"
  users:
    # Username for the login form. The PASSWORD is the same one that
    # unlocks the Homepage dashboard (dash.echoinggreen.net), so one
    # credential covers both dashboards.
    chase:
      password-hash: "${GLANCE_PASSWORD_HASH}"

branding:
  app-name: Glance
  logo-text: Chase Fleet

theme:
  background-color: "hsl(240, 10%, 7%)"
  primary-color: "hsl(150, 60%, 50%)"

pages:
  # ------------------------------------------------------------------
  # Fleet status. One monitor widget per category, laid out two across.
  # The monitor widget is the ONLY way to see fleet-wide status from
  # Glance: the docker-containers widget is node-local and its names
  # leak Swarm task IDs.
  # ------------------------------------------------------------------
  - name: Fleet
    width: wide
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 12h
            timezones:
              - timezone: America/Chicago
                label: CT
              - timezone: UTC
                label: UTC

          - type: releases
            title: New Versions
            limit: 10
            collapse-after: 5
            repositories:
              - sonarr/sonarr
              - radarr/radarr
              - lidarr/lidarr
              - prowlarr/prowlarr
              - jellyfin/jellyfin-web
              - tautulli/tautulli

      - size: full
        widgets:
          - type: split-column
            max-columns: 2
            widgets:
              - type: monitor
